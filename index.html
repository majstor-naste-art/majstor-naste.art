<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <title>Majstor-Naste</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Majstor-Naste</h1>
    <p>Професионални мајсторски услуги</p>
  </header>

  <main>
    <!-- ГАЛЕРИЈА -->
    <section id="gallery" class="page active">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">Сите</button>
        <button class="filter-btn" data-filter="bath">Бањи</button>
        <button class="filter-btn" data-filter="kitchen">Кујни</button>
        <button class="filter-btn" data-filter="other">Друго</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <!-- УСЛУГИ -->
    <section id="services" class="page">
      <h2>Наши услуги</h2>
      <ul class="services-list">
        <li>🔧 Реновирање на бањи</li>
        <li>🍳 Монтажа и реновирање на кујни</li>
        <li>🧱 Плочки и керамика</li>
        <li>🚿 Водоинсталации</li>
        <li>💡 Електрични инсталации</li>
        <li>🪚 Малтерски и гипсени работи</li>
      </ul>
    </section>

    <!-- КОНТАКТ -->
    <section id="contact" class="page">
      <h2>Контакт</h2>
      <div class="contact-card">
        <a href="tel:+38970123456" class="btn">📞 Јави се</a>
        <a href="viber://chat?number=%2B38970123456" class="btn">💬 Viber</a>
        <a href="https://wa.me/38970123456" class="btn">🟢 WhatsApp</a>
        <a href="mailto:kontakt@majstor-naste.mk" class="btn">✉️ Е-пошта</a>
      </div>
    </section>
  </main>

  <!-- ДОЛНА НАВИГАЦИЈА -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="gallery">📷<span>Галерија</span></button>
    <button class="nav-btn" data-page="services">🛠️<span>Услуги</span></button>
    <button class="nav-btn" data-page="contact">📞<span>Контакт</span></button>
  </nav>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <span class="close" id="close">&times;</span>
    <span class="nav-arrow prev" id="prev">&#10094;</span>
    <img id="lightbox-img" src="" alt="">
    <span class="nav-arrow next" id="next">&#10095;</span>
    <div class="counter" id="counter"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
